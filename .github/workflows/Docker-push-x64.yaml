name: Docker-push-x64

# 修复说明：
# 与 Docker-push-arm64.yaml 保持同一做法，避免个别镜像的 attestation 在
# amd64 链路上也触发 ACR 的 unknown manifest class 报错。
# 改用 skopeo copy --override-arch 只搬运 linux/amd64 单个平台的镜像清单与层，
# 推到 :x64 的是干净的单架构镜像，供后续 manifest 步骤合并。

on:
  workflow_dispatch:
    inputs:
      name:
        description: '请填写Docker仓库名称，默认仓库david88558855/Docker-clone-ALIYUN'
        required: true
        default: 'david88558855/Docker-clone-ALIYUN'
      tag:
        description: '请填写仓库的分支或提交记录，默认主分支mian'
        required: true
        default: 'mian'

env:
  DOCKER_REGISTRY: "${{ secrets.DOCKER_REGISTRY }}"
  DOCKER_NAMESPACE: "${{ secrets.DOCKER_NAMESPACE }}"
  DOCKER_REGISTRY_USER: "${{ secrets.DOCKER_REGISTRY_USER }}"
  DOCKER_REGISTRY_PASSWORD: "${{ secrets.DOCKER_REGISTRY_PASSWORD }}"

jobs:
  process-images:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 检出代码
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: 登录 Docker Registry
      # 凭证写入 ~/.docker/config.json，skopeo 会读取它完成目标仓库认证
      - name: Log in to Docker Registry
        run: echo "$DOCKER_REGISTRY_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_REGISTRY_USER" --password-stdin

      # Step 3: 确保 skopeo 可用
      - name: Ensure skopeo
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi
          skopeo --version

      # Step 4: 处理镜像列表
      - name: Process images from images.txt
        run: |
          # 检查 images.txt 文件是否存在
          if [[ ! -f "images.txt" ]]; then
            echo "Error: images.txt file not found in the repository root!"
            exit 1
          fi

          echo "Found images.txt file. Begin processing..."

          # 逐行读取文件内容并处理每个镜像
          while IFS= read -r SOURCE_IMAGE || [[ -n "$SOURCE_IMAGE" ]]; do
            # 兼容 Windows 换行符
            SOURCE_IMAGE=$(echo "$SOURCE_IMAGE" | tr -d '\r')

            # 跳过空行或无效行
            if [[ -z "$SOURCE_IMAGE" || "${SOURCE_IMAGE:0:1}" == "#" ]]; then
              continue
            fi

            # 分离镜像的基础名称
            IMAGE_NAME=$(echo "$SOURCE_IMAGE" | cut -d':' -f1)  # 提取镜像名称（忽略标签）

            # 构造目标镜像名称，固定标签为 `x64`
            TARGET_IMAGE="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/$(basename "$IMAGE_NAME"):x64"

            # 输出处理信息
            echo "========================================="
            echo "Processing source image: $SOURCE_IMAGE"
            echo "Target image: $TARGET_IMAGE"

            # 只搬运 linux/amd64 这一个平台的镜像清单与层。
            # attestation 的 platform 是 unknown/unknown，不会被 --override-arch 选中，
            # 因此不会把 ACR 不认识的 application/vnd.oci.empty.v1+json 推上去。
            if skopeo copy --override-os linux --override-arch amd64 \
                 "docker://$SOURCE_IMAGE" "docker://$TARGET_IMAGE"; then
              echo "Successfully mirrored: $SOURCE_IMAGE -> $TARGET_IMAGE"
            else
              echo "Error: Failed to mirror $SOURCE_IMAGE. Skipping..."
            fi
            echo "========================================="
          done < images.txt
